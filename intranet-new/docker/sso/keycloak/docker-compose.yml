services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/kc_db_password
    secrets:
      - kc_db_password
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sso-net

  keycloak:
    build:
      context: .
      dockerfile: Dockerfile
    image: intranet-sso/keycloak-ad-bridge:local
    container_name: keycloak
    restart: unless-stopped
    # "start" (não "--optimized") — o Keycloak reaugmenta a config (incluindo
    # o provider customizado ad-bridge-spi.jar) automaticamente no start.
    command: start
    ports:
      # TEMPORÁRIO — só pra testar login direto sem precisar do Caddy/hostname
      # (KC_HOSTNAME_STRICT=false aceita qualquer Host). Remover antes de
      # produção — Keycloak não deveria ficar exposto sem TLS na frente.
      - "8090:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/kc_db_password
      # TEMPORÁRIO: sem KC_HOSTNAME fixo, pra testar via IP direto — com ele
      # definido, o Keycloak gera todo link/action (inclusive o form de
      # login) usando esse hostname fixo, mesmo que o navegador tenha usado
      # outro — quebra a submissão do login se o hostname não resolver
      # (foi exatamente o que aconteceu com sso.intranet.local sem DNS).
      # Reative com o hostname real assim que ele existir de verdade.
      # KC_HOSTNAME: sso.intranet.local
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # TEMPORÁRIO — pra dar proxy via Apache do intranet-app-1 em /sso-test
      # (porta 8090 direta está bloqueada por firewall de rede). Sem isso o
      # Keycloak gera links/redirects na raiz e quebra atrás do proxy.
      KC_HTTP_RELATIVE_PATH: /sso-test
      # Caddy termina o TLS na frente e repassa como HTTP + cabeçalhos X-Forwarded-*.
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/kc_admin_password
    secrets:
      - kc_db_password
      - kc_admin_password
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - sso-net
      # O app do intranet-new roda no projeto compose "intranet" (raiz do
      # repo), rede "intranet_default" — o SPI ad-bridge chama
      # http://app/internal/ad-auth por aí (container-a-container).
      - intranet_default

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      # 80/443 do host já são do intranet-app-1 (docker-compose.yml na raiz
      # do repo) — Caddy fica em 8080/8443 por enquanto. Isso é provisório:
      # a topologia real de proxy (subdomínio dedicado, portas, etc.) ainda
      # depende do hostname de produção, que só será definido depois.
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Volume do step-ca montado só-leitura, para o Caddy confiar no root_ca.crt
      # ao fazer ACME contra a CA interna (arquivo em /stepca/certs/root_ca.crt).
      - intranet-ca-data:/stepca:ro
    depends_on:
      - keycloak
    networks:
      - sso-net

secrets:
  kc_db_password:
    file: ./secrets/kc_db_password.txt
  kc_admin_password:
    file: ./secrets/kc_admin_password.txt

volumes:
  keycloak-db-data:
  caddy-data:
  caddy-config:
  # Mesmo volume nomeado usado pelo stack do step-ca (../step-ca/docker-compose.yml).
  intranet-ca-data:
    external: true

networks:
  # Mesma rede do stack do step-ca, para o Caddy alcançar a CA para o ACME.
  sso-net:
    external: true
    name: intranet-sso-net
  # Rede default criada pelo docker-compose.yml da raiz do repo (projeto
  # "intranet"), onde roda o container "app" do intranet-new.
  intranet_default:
    external: true
