services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/kc_db_password
    secrets:
      - kc_db_password
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sso-net

  keycloak:
    build:
      context: .
      dockerfile: Dockerfile
    image: intranet-sso/keycloak-ad-bridge:local
    container_name: keycloak
    restart: unless-stopped
    # "start" (não "--optimized") — o Keycloak reaugmenta a config (incluindo
    # o provider customizado ad-bridge-spi.jar) automaticamente no start.
    command: start
    extra_hosts:
      # O intranet-new roda direto no host (sem Docker) — o SPI ad-bridge
      # precisa alcançar http://host.docker.internal/internal/ad-auth
      # (ajuste a porta/vhost real ao configurar o provider no Admin Console).
      - "host.docker.internal:host-gateway"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/kc_db_password
      # Ajuste para o hostname real pelo qual o Keycloak será acessado.
      KC_HOSTNAME: sso.intranet.local
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # Caddy termina o TLS na frente e repassa como HTTP + cabeçalhos X-Forwarded-*.
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/kc_admin_password
    secrets:
      - kc_db_password
      - kc_admin_password
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - sso-net

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Volume do step-ca montado só-leitura, para o Caddy confiar no root_ca.crt
      # ao fazer ACME contra a CA interna (arquivo em /stepca/certs/root_ca.crt).
      - intranet-ca-data:/stepca:ro
    depends_on:
      - keycloak
    networks:
      - sso-net

secrets:
  kc_db_password:
    file: ./secrets/kc_db_password.txt
  kc_admin_password:
    file: ./secrets/kc_admin_password.txt

volumes:
  keycloak-db-data:
  caddy-data:
  caddy-config:
  # Mesmo volume nomeado usado pelo stack do step-ca (../step-ca/docker-compose.yml).
  intranet-ca-data:
    external: true

networks:
  # Mesma rede do stack do step-ca, para o Caddy alcançar a CA para o ACME.
  sso-net:
    external: true
    name: intranet-sso-net
